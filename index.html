<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zão Diesel</title>
<link rel="stylesheet" href="indexcss.css">
</head>
<body>

<div class="app">
  <div id="overlay" onclick="fecharMenu()"></div>

  <!-- MENU -->
  <aside id="menu-lateral">
    <div class="logo"><img src="logo.png"> <b>ZÃO <span>DIESEL</span></b></div>
    <nav>
      <button onclick="abrir('orcamento.html',this,'Orçamento')">📄 Orçamento</button>
      <button class="ativo" onclick="abrir('produto.html',this,'Produto')">📦 Produto</button>
      <button onclick="abrir('funcionario.html',this,'Funcionário')">👥 Funcionário</button>
      <button onclick="abrir('cliente.html',this,'Cliente')">👤 Cliente</button>
      <button class="sair" onclick="location.reload()">≡ Sair</button>
    </nav>

  </aside>

  <!-- LADO DIREITO -->
  <div class="direita">
    <header class="topo"><b>Zão Diesel — Sistema de Gestão | <span id="pagina-atual">Produto</span></b><div class="topo-dir"><span>🔍 🔔 ⚙️</span><span id="hora">-</span><button id="btn-menu" onclick="abrirMenu()">☰</button></div></header>

    <main class="conteudo">
      <div class="quadro">
        <div class="quadro-topo"><b id="titulo-quadro">Produto</b></div>
        <iframe id="frame" src="produto.html"></iframe>
      </div>
    </main>
  </div>
</div>

<script>
function abrir(arquivo, btn, titulo){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('ativo'));
  if(btn) btn.classList.add('ativo');
  document.getElementById('frame').src = arquivo;
  document.getElementById('pagina-atual').innerText = titulo;
  document.getElementById('titulo-quadro').innerText = titulo;
  fecharMenu();
}
function abrirMenu(){ document.getElementById('menu-lateral').classList.add('aberto'); document.getElementById('overlay').classList.add('ativa'); }
function fecharMenu(){ document.getElementById('menu-lateral').classList.remove('aberto'); document.getElementById('overlay').classList.remove('ativa'); }
setInterval(()=>{ document.getElementById('hora').innerText = new Date().toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); },1000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
